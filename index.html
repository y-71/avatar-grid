<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Grid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2, h3 {
      margin-bottom: 1rem;
      color: #111827;
    }

    form {
      background: white;
      padding: 1.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      display: flex;
      gap: 1rem;
      flex-direction: column;
      align-items: center;
    }

    input[type="file"] {
      border: 1px solid #d1d5db;
      padding: 0.5rem;
      border-radius: 0.375rem;
      cursor: pointer;
    }

    button {
      padding: 0.5rem 1rem;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #2563eb;
    }

    #preview-container {
      margin-top: 2rem;
      text-align: center;
    }

    #channel-name {
      font-size: 1.25rem;
      color: #374151;
      margin-bottom: 1rem;
    }

    #result {
      display: none;
      border-radius: 1rem;
      max-width: 100%;
      height: auto;
      border: 4px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <h2>Upload 4 Avatars</h2>
  <form id="form">
    <input type="file" name="avatars" accept="image/*" multiple required />
    <button type="submit">Generate Grid</button>
  </form>

  <div id="preview-container">
    <div id="channel-name">#general-chat</div>
    <img id="result" alt="Avatar Grid" />
  </div>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = form.querySelector("input[type=file]");
      const files = input.files;

      const formData = new FormData();
      Array.from(files).forEach((file) => {
        formData.append("avatars", file);
      });

      const res = await fetch("/upload", {
        method: "POST",
        body: formData,
      });

      if (res.ok) {
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        result.src = url;
        result.style.display = "inline-block";
      } else {
        alert("Failed to generate image");
        result.style.display = "none";
      }
    });
  </script>
</body>
</html>
